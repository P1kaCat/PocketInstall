name: Feature or distribution request
description: Propose an improvement to PocketInstall
body:
  - type: textarea
    id: goal
    attributes:
      label: Proposal
      description: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: Sources and compatibility
      description: For a distribution, include its official page, architecture and installation method.
  - type: textarea
    id: validation
    attributes:
      label: Planned or completed validation
      description: Distinguish file delivery, startup and completed installation.
