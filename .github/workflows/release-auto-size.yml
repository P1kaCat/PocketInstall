name: Build and publish PocketInstall 3.1.2
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-auto-size]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Targeted storage regression and installer syntax
        shell: pwsh
        run: ./scripts/Test-StorageLayout.ps1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Verify automatic sizes and compile APK
        working-directory: android
        run: bash gradlew --no-daemon --console=plain :server-core:test --tests app.pocketinstall.server.WindowsDiskSizeTest --tests app.pocketinstall.server.WindowsImageTest :app:assembleDebug
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: winpe-ready
          path: compiled-winpe
          run-id: 37170716672
          github-token: ${{ github.token }}
      - name: Prepare release files
        run: |
          mkdir release-out
          cp android/app/build/outputs/apk/debug/app-debug.apk release-out/PocketInstall-3.1.2.apk
          cp compiled-winpe/PocketInstall-WinPE-x64.zip release-out/
          cp docs/WINDOWS_INSTALL.md release-out/WINDOWS-INSTALL-GUIDE.md
          cp releases/3.1.2/NOTES.md release-out/READ-ME.md
          python3 - <<'PY'
          import hashlib, pathlib
          root = pathlib.Path('release-out')
          rows = []
          for f in sorted(root.iterdir()):
              with f.open('rb') as source:
                  rows.append(hashlib.file_digest(source,'sha256').hexdigest() + '  ' + f.name + '\n')
          (root/'SHA256SUMS').write_text(''.join(rows))
          PY
      - name: Publish requested prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create v3.1.2 release-out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'PocketInstall 3.1.2 — taille Windows automatique' --notes-file releases/3.1.2/NOTES.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PocketInstall-3.1.2-build
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/server-core/build/test-results/test/*.xml
          if-no-files-found: warn
