name: PocketInstall 3.2.0 interface and terminal
on:
  push:
    branches: [main, codex/polished-interface]
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: github.ref == 'refs/heads/codex/polished-interface'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reuse compiled APK when only this workflow changed
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          changed=$(git diff --name-only f32ed2535384db44e8ec35faed45d8db2500c811 HEAD -- . ':!.github/workflows/release-polish.yml' ':!scripts/android_ui_smoke.py')
          if [ -z "$changed" ]; then
            gh api repos/$GITHUB_REPOSITORY/actions/jobs/111477818282 --jq '.steps[] | select(.name == "Verify payload routes, build and lint") | .conclusion' | grep -qx success
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.reuse.outputs.enabled == 'true'
        with:
          name: PocketInstall-3.2.0-reviewed
          path: .
          run-id: 37216447994
          github-token: ${{ github.token }}
      - name: Storage safety and installer syntax
        if: steps.reuse.outputs.enabled != 'true'
        shell: pwsh
        run: ./scripts/Test-StorageLayout.ps1
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        if: steps.reuse.outputs.enabled != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "emulator" "platform-tools" "system-images;android-35;google_apis;x86_64"'
      - name: Verify payload routes, build and lint
        if: steps.reuse.outputs.enabled != 'true'
        working-directory: android
        run: bash gradlew --no-daemon --console=plain :server-core:test --tests app.pocketinstall.server.WinPeHttpTest --tests app.pocketinstall.server.WinPeBundleTest :app:assembleDebug :app:lintDebug
      - name: Start disposable Android emulator
        run: |
          export PATH="${ANDROID_HOME}/platform-tools:${ANDROID_HOME}/emulator:$PATH"
          sudo chmod a+rw /dev/kvm
          echo no | "${ANDROID_HOME}/cmdline-tools/latest/bin/avdmanager" create avd -n PocketSmoke -k 'system-images;android-35;google_apis;x86_64' -d pixel_2
          nohup "${ANDROID_HOME}/emulator/emulator" -avd PocketSmoke -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -memory 2048 > /tmp/emulator.log 2>&1 &
          EMULATOR_PID=$!
          sleep 3
          kill -0 "$EMULATOR_PID" || { cat /tmp/emulator.log; exit 1; }
          timeout 90 adb wait-for-device || { cat /tmp/emulator.log; exit 1; }
          timeout 180 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 2; done' || { cat /tmp/emulator.log; exit 1; }
          adb shell input keyevent 82
          adb install android/app/build/outputs/apk/debug/app-debug.apk
          python3 -m pip install --disable-pip-version-check pillow
      - name: Native UI smoke and screenshots
        run: |
          export PATH="${ANDROID_HOME}/platform-tools:$PATH"
          python3 scripts/android_ui_smoke.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: PocketInstall-3.2.0-reviewed
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/reports/lint-results-debug.html
            ui-evidence/
          if-no-files-found: warn
  publish:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-polish]')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Find successful build of this exact tree
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path]))
          current=api('git/commits/'+os.environ['GITHUB_SHA'])['tree']['sha']
          runs=api('actions/runs?branch=codex%2Fpolished-interface&per_page=15')['workflow_runs']
          for run in runs:
              if run['path']!='.github/workflows/release-polish.yml' or run['conclusion']!='success': continue
              if api('git/commits/'+run['head_sha'])['tree']['sha'] != current: continue
              with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('run='+str(run['id'])+'\n')
              break
          else: raise SystemExit('No reviewed build matches this tree')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: PocketInstall-3.2.0-reviewed
          path: reviewed
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: winpe-ready
          path: compiled-winpe
          run-id: 37170716672
          github-token: ${{ github.token }}
      - name: Publish reviewed APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-out
          cp reviewed/android/app/build/outputs/apk/debug/app-debug.apk release-out/PocketInstall-3.2.0.apk
          cp compiled-winpe/PocketInstall-WinPE-x64.zip release-out/
          cp releases/3.2.0/NOTES.md release-out/READ-ME.md
          cp reviewed/ui-evidence/contact-*.jpg release-out/
          (cd release-out && sha256sum * > SHA256SUMS)
          gh release create v3.2.0 release-out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'PocketInstall 3.2.0 — interface simplifiée' --notes-file releases/3.2.0/NOTES.md
