name: PocketInstall download consent
on:
  push:
    branches: [main, feature/download-consent]
permissions:
  contents: read
  actions: read
concurrency:
  group: download-consent-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.ref == 'refs/heads/feature/download-consent'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: winpe-ready
          path: compiled-loaders
          run-id: 37170716672
          github-token: ${{ github.token }}
      - name: Prepare Android and boot assets
        run: |
          (cd compiled-loaders && sha256sum -c LOADERS-SHA256SUMS --ignore-missing)
          cp compiled-loaders/snponly.efi android/app/src/main/assets/boot/
          tar -xOf compiled-loaders/iPXE-source.tar.gz ipxe-source/COPYING > android/app/src/main/assets/licenses/iPXE.txt
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends gnu-efi
          make -C boot
          cp boot/build/bootx64.efi android/app/src/main/assets/boot/
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"
      - name: Test transfer consent, compile and lint
        working-directory: android
        run: bash gradlew --no-daemon --console=plain :server-core:test :app:assembleDebug :app:lintDebug
      - name: Package development APK
        run: |
          mkdir -p release-out
          cp android/app/build/outputs/apk/debug/app-debug.apk release-out/PocketInstall-3.4.1.apk
          cp compiled-loaders/snponly.efi compiled-loaders/iPXE-source.tar.gz release-out/
          cp releases/3.4.1/NOTES.md release-out/READ-ME.md
          (cd release-out && sha256sum * > SHA256SUMS)
          "${ANDROID_HOME}/build-tools/36.0.0/apksigner" verify release-out/PocketInstall-3.4.1.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: download-validation
          path: |
            android/server-core/build/test-results/test/*.xml
            android/app/build/reports/lint-results-debug.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PocketInstall-3.4.1-reviewed
          path: release-out/*
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-consent]')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Locate reviewed build of identical tree
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          def api(path):
              return json.loads(subprocess.check_output(['gh','api','repos/'+os.environ['GITHUB_REPOSITORY']+'/'+path]))
          tree=api('git/commits/'+os.environ['GITHUB_SHA'])['tree']['sha']
          for run in api('actions/runs?branch=feature%2Fdownload-consent&per_page=15')['workflow_runs']:
              if run['path']!='.github/workflows/release-download-consent.yml' or run['conclusion']!='success': continue
              if api('git/commits/'+run['head_sha'])['tree']['sha']!=tree: continue
              with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write('run='+str(run['id'])+'\n')
              break
          else: raise SystemExit('No successful build matches the release tree')
          PY
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: PocketInstall-3.4.1-reviewed
          path: release-out
          run-id: ${{ steps.source.outputs.run }}
          github-token: ${{ github.token }}
      - name: Publish APK and translate release pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release-out && sha256sum -c SHA256SUMS)
          gh release create v3.4.1 release-out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'PocketInstall 3.4.1 — download consent and source links' --notes-file releases/3.4.1/NOTES.md
          python3 scripts/translate_release_pages.py
