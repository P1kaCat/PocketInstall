name: Build private WinPE bundle
on:
  workflow_call:
    inputs:
      prepared_run_id:
        type: number
        default: 0
        required: false
permissions:
  contents: read
  actions: read
jobs:
  loaders:
    if: inputs.prepared_run_id == 0
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Build pinned iPXE x64 automatic Freebox loader
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential liblzma-dev mtools
          mkdir -p loader-out
          git clone https://github.com/ipxe/ipxe.git ipxe-source
          git -C ipxe-source checkout --detach 6262f1081fe185564e8ec8365a1d23597ec6e6f5
          cp winpe/loader.ipxe ipxe-source/src/pocketinstall-loader.ipxe
          make -C ipxe-source/src -j2 bin-x86_64-efi/snponly.efi EMBED=pocketinstall-loader.ipxe
          cp ipxe-source/src/bin-x86_64-efi/snponly.efi loader-out/snponly.efi
          git -C ipxe-source clean -fdX
          tar --exclude=.git --exclude='bin-*' --exclude=bin -czf loader-out/iPXE-source.tar.gz ipxe-source
          curl --fail --location --retry 3 https://github.com/ipxe/wimboot/releases/download/v2.9.0/wimboot -o loader-out/wimboot
          echo '5f067ccdc4d084d5bf77b6c853bd0f8402dfc2b4cd1b103d358993ae97fae8e3  loader-out/wimboot' | sha256sum -c -
          curl --fail --location --retry 3 https://github.com/ipxe/wimboot/archive/e5875648bd52a3b915ae54933d9adf8ac763baca.tar.gz -o loader-out/wimboot-source.tar.gz
          python3 scripts/verify_winpe_bundle.py --loader loader-out/snponly.efi
          (cd loader-out && sha256sum snponly.efi wimboot > LOADERS-SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winpe-loaders
          path: loader-out/*
          if-no-files-found: error
          retention-days: 7
  winpe:
    needs: loaders
    # Microsoft media is built for the owner of this private deployment repository.
    if: github.event.repository.private == true && inputs.prepared_run_id == 0
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: winpe-loaders
          path: loader-out
      - name: Install official Microsoft ADK and WinPE add-on
        shell: pwsh
        run: ./scripts/Install-AdkForCI.ps1
      - name: Build WinPE console and package import ZIP
        shell: pwsh
        run: |
          ./scripts/Build-WinPE.ps1 -WithPowerShell -WorkDirectory C:\PocketInstall-WinPE -OutputDirectory C:\PocketInstall-Bundle
          New-Item -ItemType Directory -Path winpe-out | Out-Null
          $wimbootHash = (Get-FileHash loader-out/wimboot -Algorithm SHA256).Hash
          $ipxeHash = (Get-FileHash loader-out/snponly.efi -Algorithm SHA256).Hash
          ./scripts/Package-WinPE.ps1 -BundleDirectory C:\PocketInstall-Bundle -Wimboot loader-out/wimboot -WimbootSha256 $wimbootHash -Ipxe loader-out/snponly.efi -IpxeSha256 $ipxeHash -OutputZip "$PWD/winpe-out/PocketInstall-WinPE-x64.zip"
          python scripts/verify_winpe_bundle.py winpe-out/PocketInstall-WinPE-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Bundle validation failed.' }
          Copy-Item loader-out/snponly.efi, loader-out/*source.tar.gz, loader-out/LOADERS-SHA256SUMS -Destination winpe-out
          Copy-Item docs/WINPE_FREEBOX.md -Destination winpe-out/WINPE-GUIDE.md
          Copy-Item C:\PocketInstall-Bundle/manifest.json -Destination winpe-out/ADK-PROVENANCE.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winpe-ready
          path: winpe-out/*
          if-no-files-found: error
          retention-days: 14
  reuse:
    if: inputs.prepared_run_id > 0
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: winpe-ready
          path: winpe-out
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
      - name: Revalidate the prepared Microsoft image
        run: |
          python3 scripts/verify_winpe_bundle.py winpe-out/PocketInstall-WinPE-x64.zip
          cp docs/WINPE_FREEBOX.md winpe-out/WINPE-GUIDE.md
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: winpe-ready
          path: winpe-out/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 14
  vm:
    needs: [winpe, reuse]
    if: always() && (needs.winpe.result == 'success' || needs.reuse.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: winpe-ready
          path: winpe-out
      - name: Boot actual WinPE via automatic PXE and Kotlin HTTP
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf python3-pil
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          (cd android && bash gradlew --no-daemon --console=plain :server-core:installDist)
          python3 scripts/verify_winpe_bundle.py winpe-out/PocketInstall-WinPE-x64.zip
          python3 scripts/qemu_winpe_boot.py --bundle winpe-out/PocketInstall-WinPE-x64.zip --server-command '["java","-cp","android/server-core/build/install/server-core/lib/*","app.pocketinstall.server.WinPeVmMainKt","{bundle}","{output}"]'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: winpe-vm-evidence
          path: |
            winpe-vm/result.json
            winpe-vm/screen.png
            winpe-vm/http.log
            winpe-vm/serial.log
            winpe-vm/qemu.log
            winpe-vm/server.log
          if-no-files-found: error
          retention-days: 14
