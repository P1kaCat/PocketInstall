name: Validate WinPE development
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  winpe:
    uses: ./.github/workflows/build-winpe.yml
    with:
      # Includes matching TPM/Secure Boot components; current installer is injected over HTTP.
      prepared_run_id: 37170055420
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK
        run: '"${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Test, compile and lint
        working-directory: android
        run: bash gradlew --no-daemon --console=plain :server-core:test :app:assembleDebug :app:lintDebug
      - name: Parse packaging script
        shell: pwsh
        run: |
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/Package-WinPE.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors; exit 1 }
          $tokens = $null; $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/winpe/Install-Windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) { $errors; exit 1 }
      - name: Keep development APK and test reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PocketInstall-WinPE-development
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/server-core/build/test-results/test/*.xml
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14
  windows-install-test:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: winpe-ready
          path: winpe-out
          run-id: 37170055420
          github-token: ${{ github.token }}
      - name: Prepare isolated Windows installation test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils ovmf swtpm python3-pil
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
          # Reclaim unused toolchains on this disposable runner before staging the ISO and QCOW2.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          (cd android && bash gradlew --no-daemon --console=plain :server-core:installDist)
      - name: Fetch original Microsoft consumer media for private testing
        run: |
          mkdir -p windows-media
          curl --fail --location --retry 3 --max-time 600 'https://software-static.download.prss.microsoft.com/dbazure/888969d5-f34g-4e03-ac9d-1f9786c66749/26200.6584.250915-1905.25h2_ge_release_svc_refresh_CLIENT_CONSUMER_x64FRE_en-us.iso' -o windows-media/windows.iso
          sha256sum windows-media/windows.iso > windows-media/source-iso.sha256
          java -cp 'android/server-core/build/install/server-core/lib/*' app.pocketinstall.server.WindowsMediaMainKt windows-media/windows.iso windows-media/install.wim
          python3 -c 'from pathlib import Path; Path("windows-media/windows.iso").unlink()'
      - name: Deploy and cold boot Windows on a disposable disk
        run: python3 scripts/qemu_windows_install.py --bundle winpe-out/PocketInstall-WinPE-x64.zip --image windows-media/install.wim
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-install-vm-evidence
          path: |
            windows-vm/result.json
            windows-vm/*.png
            windows-vm/http.log
            windows-vm/server.log
            windows-vm/qemu.log
            windows-vm/report-*
            windows-media/source-iso.sha256
          if-no-files-found: warn
          retention-days: 14
