name: Publish requested Windows installation preview
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-install-preview]')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: PocketInstall-WinPE-development
          path: compiled-apk
          run-id: 37170716672
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: winpe-ready
          path: compiled-winpe
          run-id: 37170716672
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: winpe-vm-evidence
          path: winpe-evidence
          run-id: 37170716672
          github-token: ${{ github.token }}
      - name: Prepare already compiled preview assets
        env:
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, shutil
          root = pathlib.Path('release-out'); root.mkdir()
          apk = next(pathlib.Path('compiled-apk').rglob('app-debug.apk'))
          shutil.copyfile(apk, root / 'PocketInstall-0.3.0-install-preview.apk')
          for directory, prefix in [('compiled-winpe', ''), ('winpe-evidence', 'WINPE-VM-')]:
              for file in pathlib.Path(directory).iterdir():
                  if file.is_file() and file.stat().st_size:
                      shutil.copyfile(file, root / (prefix + file.name))
          shutil.copyfile('docs/WINDOWS_INSTALL.md', root / 'WINDOWS-INSTALL-GUIDE.md')
          manifest = {
              'version': '0.3.0-install-preview', 'developmentBuild': True,
              'releaseCommit': os.environ['RELEASE_COMMIT'],
              'apkSourceCommit': 'b470498c9d4a26cb94417c8ba9b7c712bfb020f7',
              'artifactRun': 37170716672,
              'winpe': {'automaticPxeValidated': True, 'vmBootValidated': True, 'physicalBootTested': False},
              'windowsInstall': {'vmFirstBootValidated': False, 'oobeCompleted': False, 'physicalInstallValidated': False,
                  'requiresUserMicrosoftMedia': True, 'requiresLocalDiskEraseConfirmation': True},
              'artifacts': []
          }
          for file in sorted(root.iterdir()):
              digest = hashlib.file_digest(file.open('rb'), 'sha256').hexdigest()
              manifest['artifacts'].append({'name': file.name, 'bytes': file.stat().st_size, 'sha256': digest})
          (root / 'release.json').write_text(json.dumps(manifest, indent=2) + '\n')
          checksums = []
          for file in sorted(root.iterdir()):
              checksums.append(hashlib.file_digest(file.open('rb'), 'sha256').hexdigest() + '  ' + file.name + '\n')
          (root / 'SHA256SUMS').write_text(''.join(checksums))
          PY
      - name: Publish private development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.3.0-install-preview release-out/* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title 'PocketInstall 0.3.0 — installation Windows (preview)' --notes-file releases/0.3.0-install-preview/NOTES.md
